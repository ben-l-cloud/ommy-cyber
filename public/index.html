<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ommy Cyber Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #0d1117;
      color: white;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background-color: #161b22;
      border: none;
    }
    .form-control, .form-select {
      background-color: #21262d;
      border: 1px solid #30363d;
      color: white;
    }
    #qrImage {
      margin-top: 1rem;
      display: none;
    }
    #pairCode {
      margin-top: 1rem;
      font-size: 1.2rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">🤖 Ommy Cyber Bot</h2>
    <div class="card p-4 mx-auto" style="max-width: 450px;">
      <form id="pairForm">
        <div class="mb-3">
          <label for="number" class="form-label">📱 WhatsApp Number</label>
          <input type="tel" class="form-control" id="number" placeholder="e.g. 2557XXXXXXX" required />
        </div>
        <div class="mb-3">
          <label for="method" class="form-label">⚙️ Connection Method</label>
          <select class="form-select" id="method" required>
            <option value="direct">📦 Session ID Only</option>
            <option value="code">🔐 Pairing Code</option>
            <option value="qr">📸 QR Scan</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success w-100">🚀 Start Pairing</button>
      </form>
      <div id="status" class="mt-3 text-info fw-bold"></div>
      <img id="qrImage" class="img-fluid"/>
      <div id="pairCode" class="text-warning text-center"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("pairForm");
    const status = document.getElementById("status");
    const qrImage = document.getElementById("qrImage");
    const pairCode = document.getElementById("pairCode");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const number = document.getElementById("number").value.trim();
      const method = document.getElementById("method").value;
      qrImage.style.display = "none";
      pairCode.style.display = "none";
      socket.emit("startPairing", { number, method });
    });

    socket.on("status", (msg) => {
      status.textContent = msg;
    });

    socket.on("qr", (qrData) => {
      qrImage.src = qrData;
      qrImage.style.display = "block";
    });

    socket.on("pairCode", (code) => {
      pairCode.innerHTML = `🔐 Pairing Code: <strong>${code}</strong>`;
      pairCode.style.display = "block";
    });

    socket.on("error", (msg) => {
      status.textContent = msg;
      qrImage.style.display = "none";
      pairCode.style.display = "none";
    });
  </script>
</body>
</html>
