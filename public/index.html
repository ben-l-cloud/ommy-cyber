<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ommy Cyber Bot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url("cyber.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      backdrop-filter: blur(2px);
    }
    .container {
      background: rgba(0, 0, 0, 0.65);
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    input, select, button {
      width: 100%;
      padding: 0.6rem;
      margin: 0.5rem 0;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }
    button {
      background: #00ff88;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    #qrImage {
      margin-top: 1rem;
      width: 100%;
    }
    #pairCodeDisplay {
      font-size: 1.5rem;
      margin-top: 1rem;
      background: #111;
      padding: 1rem;
      border-radius: 8px;
    }
    #status {
      margin-top: 1rem;
      font-style: italic;
      color: #0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🤖 Ommy Cyber Bot</h2>
    <input type="text" id="numberInput" placeholder="Enter WhatsApp number (e.g. 2557XXXXXXX)" />
    <select id="methodSelect">
      <option value="qr">Scan QR Code</option>
      <option value="code">8-Digit Pair Code</option>
    </select>
    <button onclick="startPairing()">Start Pairing</button>

    <div id="status"></div>
    <img id="qrImage" style="display: none" />
    <div id="pairCodeDisplay" style="display: none"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function startPairing() {
      const number = document.getElementById("numberInput").value;
      const method = document.getElementById("methodSelect").value;

      document.getElementById("status").innerText = "⏳ Starting...";
      document.getElementById("qrImage").style.display = "none";
      document.getElementById("pairCodeDisplay").style.display = "none";

      socket.emit("startPairing", { number, method });
    }

    socket.on("qr", (qrImage) => {
      const qr = document.getElementById("qrImage");
      qr.src = qrImage;
      qr.style.display = "block";
    });

    socket.on("pairCode", (code) => {
      const pc = document.getElementById("pairCodeDisplay");
      pc.innerText = `🔐 Code: ${code}`;
      pc.style.display = "block";
    });

    socket.on("status", (statusText) => {
      document.getElementById("status").innerText = statusText;
    });

    socket.on("error", (errorText) => {
      document.getElementById("status").innerText = "❌ " + errorText;
    });
  </script>
</body>
</html>
