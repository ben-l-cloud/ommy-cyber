<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ommy Cyber Bot - Pairing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 1rem;
      color: #00ffa6;
      text-shadow: 0 0 5px #00ffa6;
    }
    input, select, button {
      padding: 0.8rem;
      margin: 0.5rem 0;
      width: 250px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      background: #00ffa6;
      color: #121212;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #00cc7a;
    }
    #status {
      margin-top: 1rem;
      min-height: 1.5rem;
      font-weight: bold;
    }
    #qrCode {
      margin-top: 1rem;
      max-width: 250px;
      border: 3px solid #00ffa6;
      border-radius: 10px;
      box-shadow: 0 0 10px #00ffa6;
    }
    #pairCode {
      margin-top: 1rem;
      font-size: 1.5rem;
      color: #00ffa6;
      font-weight: bold;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <h1>Ommy Cyber Bot Pairing</h1>
  <input type="text" id="phoneNumber" placeholder="Enter phone number (e.g. 25576xxxxxxx)" />
  <select id="methodSelect">
    <option value="direct">Direct Session ID</option>
    <option value="qr">QR Scan</option>
    <option value="code">8-digit Pair Code</option>
  </select>
  <button id="startBtn">Start Pairing</button>

  <div id="status"></div>
  <img id="qrCode" src="" alt="QR Code" style="display:none;" />
  <div id="pairCode" style="display:none;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const phoneInput = document.getElementById('phoneNumber');
    const methodSelect = document.getElementById('methodSelect');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const qrCodeImg = document.getElementById('qrCode');
    const pairCodeDiv = document.getElementById('pairCode');

    startBtn.onclick = () => {
      const number = phoneInput.value.trim();
      const method = methodSelect.value;

      if (!number.match(/^\d{9,15}$/)) {
        statusDiv.textContent = "❌ Invalid phone number format.";
        return;
      }

      statusDiv.textContent = "🔄 Starting pairing...";
      qrCodeImg.style.display = 'none';
      pairCodeDiv.style.display = 'none';
      qrCodeImg.src = "";
      pairCodeDiv.textContent = "";

      socket.emit('startPairing', { number, method });
    };

    socket.on('status', (msg) => {
      statusDiv.textContent = msg;
    });

    socket.on('qr', (qrDataUrl) => {
      qrCodeImg.src = qrDataUrl;
      qrCodeImg.style.display = 'block';
      pairCodeDiv.style.display = 'none';
    });

    socket.on('pairCode', (code) => {
      pairCodeDiv.textContent = code;
      pairCodeDiv.style.display = 'block';
      qrCodeImg.style.display = 'none';
    });

    socket.on('error', (err) => {
      statusDiv.textContent = err;
      qrCodeImg.style.display = 'none';
      pairCodeDiv.style.display = 'none';
    });
  </script>
</body>
</html>
