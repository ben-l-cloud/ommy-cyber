<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OMMY CYBER BOT - Pair WhatsApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #000000, #0f2027);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 0.5rem;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
    }
    #status {
      margin-top: 10px;
      font-size: 16px;
      color: #ccc;
    }
    #qr-container {
      margin-top: 30px;
      padding: 15px;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 20px rgba(0,255,204,0.3);
    }
    #qr {
      width: 250px;
      height: 250px;
      border-radius: 10px;
      background-color: #fff;
    }
    input, select, button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin: 5px;
      font-size: 16px;
    }
    input {
      width: 160px;
    }
    button {
      background-color: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0fffc4;
    }
    #pairCodeDisplay {
      margin-top: 10px;
      font-size: 18px;
      background-color: #111;
      padding: 10px;
      border-radius: 5px;
      color: #0ff;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>🤖 OMMY CYBER BOT</h1>
  <div>
    <input id="number" type="text" placeholder="Phone number e.g. 2557XXXXXXX" />
    <select id="method">
      <option value="qr">QR Code</option>
      <option value="code">Pair Code</option>
    </select>
    <button onclick="startPairing()">Connect</button>
  </div>

  <div id="status">⌛ Waiting to start...</div>

  <div id="qr-container">
    <img id="qr" src="" alt="QR Code" />
    <div id="pairCodeDisplay"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const qrImg = document.getElementById("qr");
    const pairCodeDisplay = document.getElementById("pairCodeDisplay");
    const status = document.getElementById("status");

    socket.on("qr", data => {
      qrImg.src = data;
      pairCodeDisplay.innerText = "";
    });

    socket.on("pairCode", code => {
      qrImg.src = "";
      pairCodeDisplay.innerText = "🔐 Pairing Code: " + code;
    });

    socket.on("status", msg => {
      status.innerText = msg;
    });

    socket.on("error", msg => {
      status.innerText = "❌ " + msg;
    });

    function startPairing() {
      const number = document.getElementById("number").value.trim();
      const method = document.getElementById("method").value;
      qrImg.src = "";
      pairCodeDisplay.innerText = "";
      socket.emit("startPairing", { number, method });
      status.innerText = "🔄 Connecting...";
    }
  </script>
</body>
</html>
