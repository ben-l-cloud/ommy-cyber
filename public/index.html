<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ben Whittaker Tech Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
    }

    .form {
      margin: 30px 0;
    }

    input {
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      width: 250px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background: #00cc66;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #00994d;
    }

    .status, .qr-section, .code-section {
      margin-top: 20px;
      text-align: center;
    }

    #qrImage {
      max-width: 300px;
      margin-top: 10px;
    }

    .code-section h2 {
      font-size: 24px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <h1>🤖 Ben Whittaker Tech Bot</h1>
  <form class="form" id="pairForm">
    <input type="text" id="numberInput" placeholder="Enter WhatsApp Number (e.g. 2557xxxxxxx)" required />
    <div>
      <button type="button" onclick="startPair('qr')">📸 Scan QR Code</button>
      <button type="button" onclick="startPair('code')">🔐 Get Pairing Code</button>
    </div>
  </form>

  <div class="status" id="status"></div>
  <div class="qr-section" id="qrSection" style="display: none;">
    <img id="qrImage" src="" alt="QR Code"/>
  </div>
  <div class="code-section" id="codeSection" style="display: none;">
    <h2 id="pairCode">Pairing Code</h2>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusDiv = document.getElementById("status");
    const qrSection = document.getElementById("qrSection");
    const qrImage = document.getElementById("qrImage");
    const codeSection = document.getElementById("codeSection");
    const pairCodeText = document.getElementById("pairCode");

    function startPair(type) {
      const number = document.getElementById("numberInput").value.trim();
      if (!number.match(/^\d{9,15}$/)) {
        alert("⚠️ Enter a valid phone number (9-15 digits).");
        return;
      }

      // Reset
      qrSection.style.display = "none";
      codeSection.style.display = "none";
      statusDiv.innerText = "⏳ Connecting...";

      socket.emit("startPairing", { number, method: type });
    }

    socket.on("status", (msg) => {
      statusDiv.innerText = msg;
    });

    socket.on("qr", (qrUrl) => {
      qrImage.src = qrUrl;
      qrSection.style.display = "block";
    });

    socket.on("pairCode", (code) => {
      pairCodeText.innerText = code;
      codeSection.style.display = "block";
    });

    socket.on("error", (msg) => {
      statusDiv.innerText = `❌ ${msg}`;
    });
  </script>
</body>
</html>
