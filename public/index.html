<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ben Whittaker Bot Pairing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("cyber.png") no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    #qrCode {
      margin-top: 20px;
      display: none;
      max-width: 300px;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }
    #status {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🤖 Pair Your WhatsApp Bot</h2>
    <input id="phone" type="text" placeholder="Enter your phone number" />
    <br/>
    <button onclick="start('qr')">📸 Use QR Code</button>
    <button onclick="start('code')">🔐 Use Pair Code</button>
    <p id="status">Waiting...</p>
    <img id="qrCode" src="" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const phone = document.getElementById("phone");
    const status = document.getElementById("status");
    const qrCode = document.getElementById("qrCode");

    function start(method) {
      const number = phone.value.trim();
      if (!number) return alert("Please enter your phone number.");
      qrCode.style.display = "none";
      socket.emit("startPairing", { number, method });
    }

    socket.on("status", (msg) => {
      status.innerText = msg;
    });

    socket.on("error", (msg) => {
      status.innerText = "❌ " + msg;
    });

    socket.on("qr", (dataUrl) => {
      qrCode.src = dataUrl;
      qrCode.style.display = "block";
    });

    socket.on("pairCode", (code) => {
      status.innerText = `🔐 Pairing Code: ${code}`;
    });
  </script>
</body>
</html>
