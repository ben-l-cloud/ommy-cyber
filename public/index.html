<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OMMY CYBER BOT - PAIRING SITE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("cyber.png") no-repeat center center fixed;
      background-size: cover;
      font-family: monospace, monospace;
      color: #00ffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
      padding-top: 50px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ffff;
    }
    input[type="text"] {
      font-size: 1.2rem;
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 250px;
      margin-bottom: 10px;
      outline: none;
      text-align: center;
    }
    select {
      font-size: 1.2rem;
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 270px;
      margin-bottom: 15px;
      outline: none;
      background: #001010;
      color: #00ffff;
      cursor: pointer;
    }
    button {
      font-size: 1.2rem;
      padding: 10px 25px;
      border-radius: 8px;
      border: none;
      background: #00ffff;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #00ccaa;
    }
    #status {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 1.5rem;
      text-shadow: 0 0 5px #00ffff;
    }
    #qrImage {
      margin-top: 30px;
      max-width: 300px;
      border: 4px solid #00ffff;
      border-radius: 15px;
      display: none;
      box-shadow: 0 0 15px #00ffff;
    }
    #pairCode {
      margin-top: 30px;
      font-size: 2rem;
      background: rgba(0, 255, 255, 0.1);
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid #00ffff;
      display: none;
      user-select: all;
      letter-spacing: 2px;
    }
    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 14px;
      opacity: 0.6;
      color: #00cccc;
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>🔥 OMMY CYBER BOT 🔥</h1>

  <input type="text" id="phone" placeholder="Enter your phone number (e.g. 255760317060)" maxlength="15" />
  <select id="method">
    <option value="qr">📱 Scan QR Code</option>
    <option value="code">🔐 Show Pair Code</option>
  </select>
  <button id="startBtn">Start Pairing</button>

  <div id="status"></div>

  <img id="qrImage" alt="QR Code for WhatsApp pairing" />
  <div id="pairCode"></div>

  <footer>
    Made with ❤️ by Ommy Cyber
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const phoneInput = document.getElementById("phone");
    const methodSelect = document.getElementById("method");
    const startBtn = document.getElementById("startBtn");
    const statusDiv = document.getElementById("status");
    const qrImage = document.getElementById("qrImage");
    const pairCodeDiv = document.getElementById("pairCode");

    startBtn.addEventListener("click", () => {
      const number = phoneInput.value.trim();
      const method = methodSelect.value;

      if (!number || !/^\d{9,15}$/.test(number)) {
        alert("❌ Please enter a valid phone number (digits only, 9 to 15 characters).");
        return;
      }

      // Reset UI
      statusDiv.textContent = "🔗 Connecting...";
      qrImage.style.display = "none";
      qrImage.src = "";
      pairCodeDiv.style.display = "none";
      pairCodeDiv.textContent = "";

      socket.emit("startPairing", { number, method });
    });

    socket.on("status", msg => {
      statusDiv.textContent = msg;
    });

    socket.on("qr", (dataUrl) => {
      qrImage.src = dataUrl;
      qrImage.style.display = "block";
      pairCodeDiv.style.display = "none";
      statusDiv.textContent = "📸 Scan the QR code with WhatsApp.";
    });

    socket.on("pairCode", (code) => {
      pairCodeDiv.textContent = code;
      pairCodeDiv.style.display = "block";
      qrImage.style.display = "none";
      statusDiv.textContent = "🔐 Use this code on WhatsApp → Linked Devices.";
    });

    socket.on("error", (errMsg) => {
      statusDiv.textContent = errMsg;
      qrImage.style.display = "none";
      pairCodeDiv.style.display = "none";
    });
  </script>
</body>
</html>
