<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ommy Cyber Bot - Pairing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
      background: #1e1e1e;
      border-radius: 15px;
      padding: 2rem;
      box-shadow: 0 0 30px #00ffae44;
    }

    .title {
      text-align: center;
      margin-bottom: 1rem;
    }

    .form-control, .form-select {
      background-color: #292929;
      color: #fff;
      border: none;
    }

    #qrImage, #pairCode {
      display: none;
      text-align: center;
      margin-top: 2rem;
    }

    #qrImage img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 0 20px #00ffaeaa;
    }

    .status {
      text-align: center;
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #0ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="title">🤖 Ommy Cyber Bot Pairing</h2>
    
    <form id="pairForm">
      <div class="mb-3">
        <label for="number" class="form-label">📱 Your WhatsApp Number</label>
        <input type="tel" class="form-control" id="number" placeholder="e.g. 255700000000" required />
      </div>

      <div class="mb-3">
        <label for="method" class="form-label">🔐 Pairing Method</label>
        <select class="form-select" id="method" required>
          <option value="qr">QR Code</option>
          <option value="code">8-Digit Code</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success w-100">🚀 Start Pairing</button>
    </form>

    <div id="qrImage">
      <h5>📸 Scan QR Code:</h5>
      <img id="qr" src="" alt="QR Code" />
    </div>

    <div id="pairCode">
      <h5>🔢 Your Pairing Code:</h5>
      <pre id="codeText" style="font-size: 1.5rem; font-weight: bold;"></pre>
    </div>

    <div class="status" id="status">⌛ Awaiting pairing...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("pairForm");
    const qrImage = document.getElementById("qrImage");
    const pairCode = document.getElementById("pairCode");
    const qr = document.getElementById("qr");
    const codeText = document.getElementById("codeText");
    const status = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const number = document.getElementById("number").value.trim();
      const method = document.getElementById("method").value;

      qrImage.style.display = "none";
      pairCode.style.display = "none";
      status.innerText = "⏳ Connecting...";

      socket.emit("startPairing", { number, method });
    });

    socket.on("status", (msg) => {
      status.innerText = msg;
    });

    socket.on("qr", (img) => {
      qr.src = img;
      qrImage.style.display = "block";
    });

    socket.on("pairCode", (code) => {
      codeText.innerText = code;
      pairCode.style.display = "block";
    });

    socket.on("error", (err) => {
      status.innerText = err;
      qrImage.style.display = "none";
      pairCode.style.display = "none";
    });
  </script>
</body>
</html>
